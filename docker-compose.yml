services:
  api:
    build: ./server
    container_name: ams-api
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-do-not-use-in-production-6f2b9c1a}
      - FLASK_DEBUG=0
      - PORT=5000
    volumes:
      - ams-data:/app/data
    restart: unless-stopped

  web:
    build: .
    container_name: ams-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ams-data:
