version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: insider_threat_postgres
    environment:
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: soc_secure_password_2026
      POSTGRES_DB: insider_threat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin -d insider_threat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insider_threat_backend
    environment:
      - DATABASE_URL=postgresql://soc_admin:soc_secure_password_2026@postgres:5432/insider_threat_db
      - SECRET_KEY=soc-super-secret-jwt-key-2026-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insider_threat_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
