server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (e.g. /employees/EMP-1042) - nginx needs to
    # fall back to index.html for any path that isn't a real static file, or a page
    # refresh on a sub-route would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
